[tools]
node = "24"
duckdb = "latest"
oxlint = "latest"
oxfmt = "latest"

[tasks.dev]
description = "Dev server"
run = "npm run dev"

[tasks.build]
description = "Build the static site into dist/"
run = "npm run build"

[tasks.fmt]
description = "Format everything in place"
run = "oxfmt"

[tasks.lint]
description = "Check formatting, lints and types"
run = ["oxfmt --check", "oxlint --deny-warnings", "npx astro check"]
